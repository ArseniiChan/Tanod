openapi: 3.1.0
info:
  title: Tikbalang Telemetry Bridge
  version: 1.0.0
  description: |
    The contract every layer of Tikbalang agrees on.

    Three ports, and only one of them is REST:

    | Port | Protocol | Who uses it |
    |------|----------|-------------|
    | 8765 | WebSocket | dashboards, subscribing to the live stream |
    | 8766 | TCP, one JSON object per line | boards and forwarders pushing frames |
    | 8767 | HTTP, this document | teammates, curl, anything that prefers REST |

    ## The WebSocket stream is not described here, on purpose

    OpenAPI describes request/response over HTTP. It has no way to express a
    server-pushed stream, so the `:8765` feed is documented in prose here and
    its payloads are the same `Frame` schemas below. Every frame a dashboard
    receives validates against `Frame`. If you want a machine-readable spec for
    the stream itself, that is AsyncAPI, not this.

    Do not poll `GET /state` in place of the WebSocket. The node emits at 5 Hz
    and a robot at 20 Hz; polling loses frames and costs more than subscribing.
    `GET /state` answers "what is true right now", which is a different and
    smaller question.

    ## Frames

    Two shapes share the stream, told apart by `src`:

    - `node-*` emits `NodeFrame`, built by `node/frame.cpp`
    - `unit-*` emits `UnitFrame`, the vehicle pose contract

    `decided_on` carries the project's central claim: whether a decision was
    made on the device or in the cloud. It is a field, never a constant.

servers:
  - url: http://localhost:8767
    description: bridge on this machine
  - url: http://{host}:8767
    description: bridge on a teammate's machine
    variables:
      host:
        default: 10.189.66.227
        description: LAN address of whichever laptop runs the bridge

paths:
  /health:
    get:
      summary: Is the bridge up, and who is connected
      operationId: getHealth
      responses:
        "200":
          description: Bridge is running
          content:
            application/json:
              schema:
                type: object
                required: [status, dashboards, sources]
                properties:
                  status: { type: string, const: up }
                  dashboards:
                    type: integer
                    description: WebSocket clients currently subscribed
                  sources:
                    type: array
                    items: { type: string }
                    description: every src seen since the bridge started
              example:
                status: up
                dashboards: 1
                sources: [node-01, unit-01]

  /state:
    get:
      summary: Most recent frame from every source
      description: |
        The bridge keeps the newest frame per `src`, which is what a new console
        is replayed on connect so the screen is never blank.

        Every entry carries `age_s` and `stale`. **Check them.** A sensor that
        stopped transmitting and a sensor reporting steady water produce an
        identical cached frame, and a reading nobody can date is a reading
        nobody should trust.
      operationId: getState
      responses:
        "200":
          description: One entry per source, each with its age
          content:
            application/json:
              schema:
                type: object
                required: [sources, stale_after_s]
                properties:
                  stale_after_s:
                    type: number
                    description: Age past which a source is reported stale.
                  sources:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/DatedFrame"

  /state/{src}:
    get:
      summary: Most recent frame from one source
      operationId: getStateBySrc
      parameters:
        - name: src
          in: path
          required: true
          schema: { type: string }
          example: node-01
      responses:
        "200":
          description: The newest frame from that source, with its age
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatedFrame" }
        "404":
          description: No frame has ever arrived from that src
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ingest:
    post:
      summary: Push one frame, or a batch
      description: |
        For producers that would rather speak HTTP than open a TCP socket.
        Accepted frames are relayed to every dashboard immediately and become
        the source's current state.

        This endpoint is for convenience and testing. A board streaming at 5 Hz
        or better should use the TCP line protocol on `:8766`, which avoids a
        request/response round trip per frame.
      operationId: postIngest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Frame"
                - type: array
                  items: { $ref: "#/components/schemas/Frame" }
            examples:
              single:
                summary: one node frame
                value:
                  src: node-01
                  t: 1789840000
                  link: { uplink: false, inference: local }
                  water: { rungs: 6, wet: 3, mm: 30 }
                  tds: { ppm: 412, trend: steady }
                  temp_c: 18.4
                  sound: { event: none, conf: 0.0 }
                  hazard:
                    state: SHALLOW_CROSSING
                    conf: 0.88
                    why: 3 of 6 rungs wet, 30mm, turbidity 412 ppm
                  decided_at: 1789840000
                  decided_on: device
      responses:
        "202":
          description: Accepted and relayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
        "400":
          description: Body is not JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Body over 64 KB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: A frame is missing src
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /triage:
    post:
      summary: Ask the cloud, fall back to the device
      description: |
        Makes a **real** HTTPS call to a real model. It can really fail, and
        when it does the failure is reported verbatim: the status code, the DNS
        error, the timeout. Nothing here simulates an outage.

        When the cloud does not answer, the response carries the verdict the
        node already reached on its own, with `decided_on: device`. That is the
        project's entire claim, observable in one field from outside the
        process.

        The timeout is 4 s by default (`TRIAGE_TIMEOUT`). A dispatcher that
        hangs for thirty seconds on a dead tower has already failed.

        Requires `OPENAI_API_KEY` in the bridge's environment. Without it the
        endpoint still makes a real network call, reports reachability, and
        says plainly that no triage was requested.
      operationId: postTriage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                src:
                  type: string
                  default: node-01
                  description: Use the bridge's most recent frame from this source.
                frame:
                  $ref: "#/components/schemas/NodeFrame"
                  description: Or supply a frame directly, overriding src.
      responses:
        "200":
          description: |
            A decision always exists, so this is 200 whether or not the cloud
            answered. The interesting field is `decided_on`, not the status code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Triage" }
              examples:
                cloud:
                  summary: the cloud answered
                  value:
                    ok: true
                    decided_on: cloud
                    source: gpt-4o-mini
                    text: Do not send a ground unit, 50 mm exceeds the 30 mm limit.
                    error: null
                    latency_ms: 812
                deviceFallback:
                  summary: the cloud did not, so the chip's verdict stands
                  value:
                    ok: true
                    decided_on: device
                    source: device
                    text: "IMPASSABLE: 5 of 6 rungs wet, 50mm exceeds 30mm passable depth"
                    error: cloud timed out after 4.0s
                    latency_ms: 4009
        "404":
          description: No frame has ever arrived from that src
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: dispatch/triage.py could not be imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /uplink:
    get:
      summary: Is the operator holding the uplink down
      operationId: getUplink
      responses:
        "200":
          description: Current uplink state at the bridge
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked_at_bridge:
                    type: boolean
                    description: |
                      Set by the dashboard's CUT NETWORK control. Reported
                      rather than hidden, so the console can say where the
                      break is instead of implying a failure that did not
                      happen.
                  triage_available: { type: boolean }

  /:
    get:
      summary: The operations console
      description: |
        Serves `dashboard/index.html` so the page and this API share an origin.
        Opened as `file://` the page has an opaque origin and Chrome blocks its
        fetches to localhost regardless of CORS headers, which silently kills
        the triage panel.
      operationId: getConsole
      responses:
        "200":
          description: The console
          content:
            text/html:
              schema: { type: string }

  /openapi.yaml:
    get:
      summary: This document
      operationId: getSpec
      responses:
        "200":
          description: The spec
          content:
            application/yaml:
              schema: { type: string }

components:
  schemas:
    Frame:
      description: Anything on the stream. Discriminated by the src prefix.
      oneOf:
        - $ref: "#/components/schemas/NodeFrame"
        - $ref: "#/components/schemas/UnitFrame"

    NodeFrame:
      type: object
      description: |
        Field node telemetry, built by `node/frame.cpp`. The classifier that
        fills `hazard` runs on the chip and never calls the network.
      required: [src, t, link, water, tds, temp_c, sound, hazard, decided_at, decided_on]
      properties:
        src:
          type: string
          pattern: "^node-"
          example: node-01
        t:
          type: integer
          description: Producer clock. Not synchronised between machines, so do
            not order frames from different sources by this field.
        link:
          type: object
          required: [uplink, inference]
          properties:
            uplink:
              type: boolean
              description: Is the route to the internet alive. False is the
                interesting case and the demo's whole point.
            inference:
              type: string
              enum: [local, cloud]
        water:
          type: object
          required: [rungs, wet, mm]
          properties:
            rungs:
              type: integer
              description: Electrodes on the ladder. Six in the current build.
              example: 6
            wet:
              type: integer
              minimum: 0
              description: How many are submerged.
            mm:
              type: integer
              description: Depth implied by wet count. Rungs sit every 10 mm, so
                this is quantised to 10, not continuous.
        tds:
          type: object
          required: [ppm, trend]
          properties:
            ppm:
              type: integer
              description: Dissolved solids. Sewage and runoff push this up.
            trend:
              type: string
              enum: [rising, steady, falling]
              description: |
                Direction of change against the previous reading from this
                source, with a 20 ppm deadband so sensor noise does not flap
                the label. "steady" until a second reading exists.
        temp_c: { type: number }
        sound:
          type: object
          required: [event, conf]
          properties:
            event:
              type: string
              enum: [none, rain, distress]
            conf:
              type: number
              minimum: 0
              maximum: 1
        hazard:
          type: object
          required: [state, conf, why]
          properties:
            state:
              type: string
              enum: [UNKNOWN, DRY, SHALLOW_CROSSING, CONTAMINATED, IMPASSABLE]
              description: |
                Depth decides passability first. Contamination is a warning on
                top, never a reason to call something passable. Above 30 mm is
                IMPASSABLE for a ground unit.
            conf: { type: number, minimum: 0, maximum: 1 }
            why:
              type: string
              maxLength: 120
              description: A plain sentence the node writes itself, for a human
                reading the screen. Never a code.
        decided_at: { type: integer }
        decided_on:
          type: string
          enum: [device, cloud]
          description: |
            Where this verdict was reached. The claim the whole project rests
            on. Never hardcode it.

    UnitFrame:
      type: object
      description: |
        Surface unit telemetry, built by `firmware/boat/boat.ino`.

        **`pose` is nullable and on the real hardware it is always null.** The
        unit floats, so there are no wheel ticks to integrate, and it runs
        indoors, so there is no GNSS fix. A consumer that assumes coordinates
        will break the first time it sees real hardware. The recorded mission
        replayed by the dashboard does carry a pose, because it came from
        `sim/main_native.cpp` where position is known by construction.

        `wp` and `battery_pct` are optional for the same reason: there is no
        waypoint follower and no fuel gauge on this build. They are absent
        rather than zero, because zero is a measurement and absent is not.
      required: [src, t, pose, mode, mission]
      properties:
        src:
          type: string
          pattern: "^unit-"
          example: unit-01
        t: { type: number }
        pose:
          type: [object, "null"]
          description: |
            Null when the unit has no position fix, which is the normal case
            on hardware. Never synthesise a value to fill this.
          required: [lat, lon, hdg]
          properties:
            lat: { type: number }
            lon: { type: number }
            hdg:
              type: number
              minimum: 0
              exclusiveMaximum: 360
              description: Compass convention. Increases clockwise from north.
        mode:
          type: string
          enum: [IDLE, PLANNING, DRIVING, AVOIDING, ARRIVED, DELIVERED]
        wp:
          type: integer
          description: |
            Index of the waypoint being driven to. Present only on the
            simulated mission; the hardware unit follows no waypoints.
        obstacle_mm:
          type: [integer, "null"]
          description: |
            Range in mm to the nearest obstacle ahead, taken as the minimum of
            the centre zones of the SEN0628 8x8 array. Null means no zone
            returned a usable range, which is a sensor fault and is treated as
            a reason to stop, never as open water. When it is null, `fault`
            carries the reason.
        fault:
          type: string
          description: Present only when the unit cannot measure. Human readable.
          example: lidar not responding
        mission: { type: string, example: m-live }
        battery_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: Simulated mission only. This build has no battery monitor.
        link:
          type: object
          required: [uplink, inference]
          properties:
            uplink: { type: boolean }
            inference:
              type: string
              enum: [local, cloud]
        decided_on:
          type: string
          enum: [device, cloud]
          description: Where the unit's own stop/go decision was made.

    DatedFrame:
      type: object
      description: |
        A cached frame plus how old it is. The age is the point: without it a
        dead sensor is indistinguishable from a calm one.
      required: [age_s, stale, frame]
      properties:
        age_s:
          type: number
          description: Seconds since the bridge last received a frame from this source.
        stale:
          type: boolean
          description: True once age_s exceeds stale_after_s.
        frame:
          $ref: "#/components/schemas/Frame"

    Triage:
      type: object
      description: |
        A dispatch decision and, crucially, where it was made.
      required: [ok, decided_on, source, text, latency_ms]
      properties:
        ok: { type: boolean }
        decided_on:
          type: string
          enum: [cloud, device]
          description: |
            `cloud` means a real remote call returned. `device` means it did not,
            and the verdict the ESP32 reached on its own is standing in. This is
            the field the whole project exists to demonstrate.
        source:
          type: string
          description: The model that answered, or `device`, or `probe`.
        text:
          type: string
          description: The triage line, or the node's own `hazard.why`.
        error:
          type: [string, "null"]
          description: |
            Why the cloud did not answer, verbatim. Null when it did.
        latency_ms:
          type: integer
          description: Real measured time, including a real timeout.
        blocked_at:
          type: string
          enum: [bridge]
          description: |
            Present only when an operator cut the uplink at the bridge, so the
            console can distinguish a deliberate cut from a genuine outage.

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
